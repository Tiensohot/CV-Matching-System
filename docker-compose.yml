services:

  db:
    image: pgvector/pgvector:pg16
    container_name: cv_matching_db
    environment:
      POSTGRES_DB      : cv_matching
      POSTGRES_USER    : postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test    : ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout : 5s
      retries : 5

  backend:
    build:
      context   : ./backend
      dockerfile: Dockerfile
    container_name: cv_matching_backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/cv_matching
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./backend/models:/app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context   : ./frontend
      dockerfile: Dockerfile
    container_name: cv_matching_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: